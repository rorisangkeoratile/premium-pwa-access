# Render Blueprint: deploys the LesediLink frontend as a Static Site.
# Render dashboard: New > Blueprint, pick this repo. Or copy these values into a manual Static Site.
services:
  - type: web
    runtime: static
    name: lesedilink
    buildCommand: npm install && npm run build
    staticPublishPath: .output/public
    envVars:
      - key: NODE_VERSION # Vite 8 needs Node 20.19+ or 22.12+
        value: 22
      - key: VITE_API_URL # the FastAPI backend, e.g. https://lesedilink-api.onrender.com
        sync: false
    routes:
      # Every URL is the same single-page app, so deep links such as /dashboard/customer still work.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Fingerprinted files never change, so they can be cached for a year.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The service worker and the page shell must always be re-checked, or updates never arrive.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
